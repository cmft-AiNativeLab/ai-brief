server {
    listen 80;
    server_name _;
    root /srv/ai-brief/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    etag on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* ^/download/latest(?:-overview|-card)?\.(?:pdf|png)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri.html $uri/ =404;
    }
}
