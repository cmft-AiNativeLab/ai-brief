services:
  web:
    image: nginx:1.27-alpine
    container_name: ai-brief-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/data/openclaw-leader/workspace/skills/ai-brief-daily/.deploy:/srv/ai-brief:ro
    networks:
      - nginx-proxy-manager_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  nginx-proxy-manager_default:
    external: true
