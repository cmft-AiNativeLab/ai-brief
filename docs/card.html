<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 简讯 · 招商金科</title>
<meta property="og:title" content="AI 简讯 · 招商金科">
<meta property="og:description" content="每日 AI 行业关键动向 — 战略 / 行业 / 实践 + 大模型能力榜">
<meta property="og:image" content="https://cmft-AiNativeLab.github.io/ai-brief/logo.png">
<meta name="theme-color" content="#e2e7ef">
<style>
  /* === 容器环境字体兜底：@font-face 注册本地中文字体 === */
  @font-face {
    font-family: 'Noto Serif SC';
    src: local('NotoSerifCJKsc-Regular'),
         local('Noto Serif CJK SC'),
         url('/tmp/libs/usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc') format('truetype'),
         url('/home/node/.openclaw/workspace/fonts/NotoSansCJKsc-Regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Noto Serif SC';
    src: local('NotoSerifCJKsc-Bold'),
         local('Noto Serif CJK SC Bold'),
         url('/tmp/libs/usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc') format('truetype'),
         url('/home/node/.openclaw/workspace/fonts/NotoSansSC-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Noto Sans SC';
    src: local('NotoSansCJKsc-Regular'),
         local('Noto Sans CJK SC'),
         url('/tmp/libs/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc') format('truetype'),
         url('/home/node/.openclaw/workspace/fonts/NotoSansSC.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'Noto Sans SC';
    src: local('NotoSansCJKsc-Bold'),
         local('Noto Sans CJK SC Bold'),
         url('/tmp/libs/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc') format('truetype'),
         url('/home/node/.openclaw/workspace/fonts/NotoSansSC-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  :root{
    --bg:#e2e7ef;            /* 冷调纸感 */
    --bg-soft:#ecf0f5;
    --steel:#3a5a8c;         /* 钢蓝（替代金色，做强调） */
    --steel-soft:#7287a8;    /* 浅蓝灰 */
    --bronze:#a38660;        /* 暖铜（杂志封面日期/序号色） */
    --ink:#1c2433;           /* 冷墨 */
    --ink2:#3a4659;
    --grey:#6c7587;
    --pill:#161d2c;          /* 来源胶囊深底 */
    --pill-ink:#9bb3d4;      /* 冷调金属字 */
    /* 杂志封面字体栈：Didot / Bodoni 强对比衬线，中文回落到宋体 */
    --display:"Didot","Bodoni 72","Bodoni 72 Smallcaps","Playfair Display","Songti SC","STSong","Source Han Serif SC","Noto Serif SC",Georgia,serif;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; max-width:100vw; overflow:hidden; }
  body{ font-family:var(--serif);
    background:linear-gradient(160deg,#d2dae6 0%,#dee4ed 35%,#cad3df 100%);
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:10px; }

  /* 主卡：强制 9:16 竖版，尽量侵占画布；中部信息区按剩余空间自适应。 */
  .card{ --card-w:min(calc(100vw - 20px), calc((100vh - 20px) * 9 / 16), 880px);
    position:relative; width:var(--card-w); height:calc(var(--card-w) * 16 / 9);
    aspect-ratio:9/16;
    border-radius:30px; overflow:hidden;
    background:linear-gradient(168deg,var(--bg-soft) 0%,var(--bg) 60%,#d6dde8 100%);
    box-shadow:0 30px 70px rgba(28,36,55,.24), inset 0 1px 0 rgba(255,255,255,.6);
    padding:30px 28px 18px; display:flex; flex-direction:column; }

  /* 右上角放射冷光（替代暖金光） */
  .card::before{ content:''; position:absolute; top:-160px; right:-160px;
    width:480px; height:480px; border-radius:50%;
    background:
      radial-gradient(circle at center,
        rgba(114,135,168,.28) 0%,
        rgba(58,90,140,.16) 28%,
        rgba(58,90,140,.08) 55%,
        transparent 78%);
    pointer-events:none; }
  /* 同心圆细线点缀 */
  .card::after{ content:''; position:absolute; top:-188px; right:-188px;
    width:540px; height:540px; border-radius:50%;
    border:1px solid rgba(58,90,140,.16); pointer-events:none; }

  /* Row 1：标题（杂志封面式高对比衬线）；日期改为绝对定位的角落印章 */
  .row-1{ position:relative; z-index:1; display:flex; align-items:baseline; }
  .title{ font-family:var(--display); font-size:clamp(30px,5.1vw,46px); font-weight:700;
    letter-spacing:2.2px; color:var(--ink); line-height:.95; }
  /* 日期：右上角"钢印"——衬线 + 暗压字 + 高光与暗影模拟压印纸面 */
  .date{ position:absolute; top:22px; right:26px; z-index:3;
    font-family:"Bodoni 72","Didot","Playfair Display",Georgia,serif;
    font-size:11.5px; font-weight:700; letter-spacing:1.5px;
    color:rgba(58,90,140,.85);
    text-shadow:
      0 1px 0 rgba(255,255,255,.75),
      0 -1px 0 rgba(28,36,55,.12),
      1px 1px 1px rgba(28,36,55,.08);
    font-feature-settings:"tnum","lnum";
    -webkit-font-smoothing:antialiased; }

  /* Row 2：副标 + 出品方 */
  .row-2{ position:relative; z-index:1; margin-top:9px; padding-bottom:12px;
    border-bottom:1px dashed rgba(58,90,140,.4);
    display:flex; justify-content:space-between; align-items:baseline; gap:16px;
    font-family:var(--sans); font-size:clamp(11px,1.45vw,13px); color:var(--ink2); }
  .tagline{ letter-spacing:.4px; }
  .by{ font-family:"SF Pro Text","Helvetica Neue","Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    color:var(--steel-soft); font-weight:700; letter-spacing:.5px; }

  /* Row 3：今日精选区——居中、用毛玻璃框包裹 */
  .row-3{ position:relative; z-index:1; margin-top:16px; flex:1; min-height:0;
    display:flex; flex-direction:column; justify-content:stretch; gap:14px; }
  .hot-box{ position:relative; flex:1; min-height:0;
    display:flex; flex-direction:column;
    background:rgba(255,255,255,.52);
    backdrop-filter:blur(14px) saturate(120%);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    border:1px solid rgba(255,255,255,.72);
    border-radius:20px; padding:18px 20px 14px; overflow:hidden;
    box-shadow:0 10px 26px rgba(28,36,55,.10), inset 0 1px 0 rgba(255,255,255,.75); }
  .label{ font-family:var(--sans); font-size:clamp(10px,1.25vw,12px); font-weight:800;
    letter-spacing:3.2px; color:var(--steel); margin-bottom:10px; }
  .hot-title{ font-family:var(--sans); font-weight:800; font-size:clamp(17px,2.5vw,22px);
    line-height:1.34; color:var(--ink); margin-bottom:10px; letter-spacing:.35px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  /* 引文区：底色横向延展到卡片边框；上下也渐变淡出（四向羽化） */
  .quote{ position:relative; flex:1; min-height:0; display:flex; align-items:center;
    padding:12px 10px; margin:2px 0; }
  .quote::before{ content:''; position:absolute; top:-6px; bottom:-6px;
    left:-120px; right:-120px;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(58,90,140,.06) 8%,
      rgba(58,90,140,.16) 35%,
      rgba(58,90,140,.16) 65%,
      rgba(58,90,140,.06) 92%,
      transparent 100%);
    -webkit-mask:linear-gradient(180deg,
      transparent 0%,
      #000 25%,
      #000 75%,
      transparent 100%);
    mask:linear-gradient(180deg,
      transparent 0%,
      #000 25%,
      #000 75%,
      transparent 100%);
    pointer-events:none; }
  .quote p{ position:relative; z-index:1; }
  .quote p{ font-family:var(--serif); font-size:clamp(15px,2.2vw,19px); font-weight:700;
    line-height:1.58; color:var(--ink); letter-spacing:.25px; text-indent:0;
    display:-webkit-box; -webkit-line-clamp:10; -webkit-box-orient:vertical; overflow:hidden; }
  .quote p::before{ content:'\201C'; color:var(--steel-soft);
    font-family:Georgia,serif; font-weight:700; margin-right:2px; }
  .quote p::after{ content:'\201D'; color:var(--steel-soft);
    font-family:Georgia,serif; font-weight:700; margin-left:2px; }
  /* 源胶囊靠右，仍在毛玻璃框内 */
  .source-row{ margin-top:8px; display:flex; justify-content:flex-end; }
  .source-pill{ background:var(--pill); color:var(--pill-ink);
    padding:5px 12px; border-radius:18px;
    font-family:var(--sans); font-size:clamp(10px,1.2vw,11.5px); letter-spacing:.25px; }

  /* SO WHAT 模块：编辑视角点评，置于 hot-box 之下 */
  .sw-box{ position:relative; z-index:1; flex:0 0 auto;
    padding:10px 14px 10px 16px; max-height:calc(var(--card-w) * .30); overflow:hidden;
    border-left:3px solid var(--steel);
    background:linear-gradient(95deg, rgba(58,90,140,.10), rgba(58,90,140,.04) 70%, transparent);
    border-radius:0 12px 12px 0; }
  .sw-label{ font-family:var(--sans); font-size:10.5px; font-weight:800;
    letter-spacing:3px; color:var(--steel); margin-bottom:6px; }
  .sw-label::before{ content:'◆ '; font-size:8px; vertical-align:1px; }
  .sw-text{ font-family:var(--serif); font-size:clamp(12px,1.65vw,14.5px); font-weight:600;
    line-height:1.48; color:var(--ink2); letter-spacing:.2px;
    display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }

  /* Row 4：底部 QR（左）；logo 改用绝对定位贴右下角，与右上日期形成对角轴 */
  .row-4{ position:relative; z-index:1; margin-top:12px; padding-top:8px;
    display:flex; justify-content:flex-start; align-items:flex-end; gap:12px; }
  .qr-group{ display:flex; gap:14px; align-items:flex-start; }
  .qr-mini{ text-decoration:none; color:inherit; text-align:center; transition:.18s; }
  .qr-mini:hover{ transform:translateY(-1px); }
  .qr-mini img{ width:clamp(58px,8.2vw,74px); height:clamp(58px,8.2vw,74px); display:block;
    filter:drop-shadow(0 2px 4px rgba(28,36,55,.16)); }
  .qr-mini .lbl{ margin-top:4px; font-family:var(--sans); font-size:10px; font-weight:700;
    color:var(--ink2); letter-spacing:.3px; }
  /* logo 钉到卡片右下角边缘，更贴右框 */
  .foot-logo{ position:absolute; bottom:10px; right:12px; z-index:3;
    height:clamp(20px,3vw,28px); width:auto; opacity:.95;
    filter:drop-shadow(0 1px 3px rgba(28,36,55,.14)); }

  /* —— 窄屏适配：保持 9:16，不再让高度自由生长 —— */
  @media (max-width:460px){
    body{ padding:8px; min-height:100vh; overflow:hidden; }
    .card{ --card-w:min(calc(100vw - 16px), calc((100vh - 16px) * 9 / 16));
      padding:22px 18px 14px; border-radius:22px; }
    .card::before{ top:-110px; right:-110px; width:320px; height:320px; }
    .card::after{ top:-130px; right:-130px; width:360px; height:360px; }
    .date{ top:18px; right:18px; font-size:10.5px; letter-spacing:1.2px; }
    .row-2{ flex-direction:column; align-items:flex-start; gap:3px; padding-bottom:10px; }
    .row-3{ margin-top:12px; gap:10px; }
    .hot-box{ padding:14px 14px 11px; border-radius:15px; }
    .label{ letter-spacing:3px; margin-bottom:8px; }
    .hot-title{ margin-bottom:8px; }
    .quote{ padding:8px 5px; }
    .quote::before{ inset:-3px -4px -3px; filter:blur(1px); }
    .source-row{ margin-top:6px; }
    .sw-box{ padding:8px 10px 8px 12px; max-height:calc(var(--card-w) * .34); }
    .sw-label{ margin-bottom:4px; }
    .row-4{ margin-top:8px; padding-top:4px; }
    .qr-group{ gap:10px; }
    .qr-mini .lbl{ font-size:9px; }
    .foot-logo{ bottom:8px; right:10px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="date">20260616</div>
    <div class="row-1">
      <div class="title">AI 简讯</div>
    </div>
    <div class="row-2">
      <div class="tagline">每日 AI 行业关键动向 · 战略 / 行业 / 实践</div>
      <div class="by">由 招商金科 出品</div>
    </div>
    <div class="row-3">
      <div class="hot-box">
        <div class="label">BREAKING NEWS</div>
        <div class="hot-title">Anthropic高层与特朗普政府官员举行会谈</div>

        </div>
        <div class="source-row">
          <div class="source-pill">源：华尔街见闻 · ★★★★★</div>
        </div>
      </div>
      <div class="sw-box">
        <div class="sw-label">SO WHAT</div>

      </div>
    </div>
    <div class="row-4">
      <div class="qr-group">
        <a class="qr-mini" href="./">
          <img src="qr.png" alt="今日资讯">

          <img src="qr-download.png" alt="往期下载">

      </div>
      <img class="foot-logo" src="logo.png" alt="招商金融科技 · CMG Fintech">
    </div>
  </div>

<script>
(function(){
  function classify(href){
    var p=(new URL(href,location.href)).pathname.split('/').pop()||'';
    if(/7days\.pdf$/i.test(p)) return 'weekly_pdf';
    if(/latest\.pdf$/i.test(p)||/ai-brief-20\d{6}\.pdf$/i.test(p)) return 'daily_pdf';
    if(/overview.*\.png$/i.test(p)) return 'overview_png';
    if(/card.*\.png$/i.test(p)) return 'card_png';
    if(/\.pdf$/i.test(p)) return 'other_pdf';
    if(/\.png$/i.test(p)) return 'other_png';
    return '';
  }
  document.addEventListener('click',function(ev){
    var a=ev.target.closest&&ev.target.closest('a[href]');
    if(!a)return;
    var href=a.getAttribute('href')||'';
    var isDl=a.hasAttribute('download')||/\.(pdf|png)(\?|#|$)/i.test(href);
    if(!isDl)return;
    var type=classify(href);
    if(type){
      _hmt.push(['_trackEvent','download',type,a.textContent.trim().slice(0,60)]);
    }
  },true);
})();
</script></body>
